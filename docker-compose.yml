version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: postgres_db
    environment:
      POSTGRES_USER: dhairya
      POSTGRES_PASSWORD: dhairya
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_db
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: coding_agent_api
    environment:
      - POSTGRES_URI=postgresql://dhairya:dhairya@postgres:5432/postgres
      - AGENT_QDRANT_URL=http://qdrant:6333
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - AGENT_MODEL_PROVIDER=${AGENT_MODEL_PROVIDER:-nvidia}
      - AGENT_MODEL_NAME=${AGENT_MODEL_NAME:-nvidia/nemotron-3.5-super-vl-120b-a12b}
      - AGENT_APPROVAL_MODE=ask
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - postgres
      - qdrant
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
